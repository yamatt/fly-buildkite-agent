# fly.toml app configuration file generated for buildkite-agent on 2026-10-09T17:21:38+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

primary_region = 'lhr'

[build]
[http_service]
internal_port = 8080
force_https = true
auto_start_machines = true
min_machines_running = 0
processes = ['app']
idle_timeout = '900'

[env]
BUILDKITE_AGENT_NAME = 'fly-buildkite-agent'
BUILDKITE_AGENT_DISCONNECT_AFTER_JOB = 'true'
BUILDKITE_AGENT_DISCONNECT_AFTER_UPTIME = '60'
BUILDKITE_WRITE_JOB_LOGS_TO_STDOUT = 'true'

[[restart]]
policy = 'never'
processes = ['app']

[[vm]]
cpu_kind = 'shared'
cpus = 4
memory_mb = 2048
